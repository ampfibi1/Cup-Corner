<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Cup Corner</title>
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/logo.png" alt="Cup Corner logo"><div style="font-weight:700">Cup Corner</div></div>
    <nav><a href="dashboard.html">Dashboard</a></nav>
  </header>
  <main>
    <section class="admin-hero">
      <div class="hero-copy">
        <span class="eyebrow">Admin Panel</span>
        <h1>Manage the Coffee Shop</h1>
        <p class="muted">Add menu items, track inventory, and review your latest orders from a single modern dashboard.</p>
        <div class="hero-actions">
          <a class="nav" href="dashboard.html">Dashboard</a>
          <a class="nav" href="menu.html">Menu</a>
        </div>
      </div>
      <div class="admin-stat-grid">
        <div class="stat-card">
          <span class="stat-label">Products</span>
          <strong id="productCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Orders</span>
          <strong id="orderCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">Revenue</span>
          <strong id="orderRevenue">৳0.00</strong>
        </div>
      </div>
    </section>

    <section class="admin-grid">
      <article class="admin-card">
        <div class="card-header">
          <h2>Add Product</h2>
          <span class="tag">Quick add</span>
        </div>
        <div class="form-row admin-form-row">
          <input id="pName" placeholder="Brew name" type="text">
          <input id="pPrice" placeholder="Price" type="number">
          <button id="addProductBtn" class="btn">Add</button>
        </div>
      </article>

      <article class="admin-card">
        <div class="card-header">
          <h2>Menu Catalog</h2>
          <span class="tag">Editable</span>
        </div>
        <div id="adminProducts" class="admin-list"></div>
      </article>

      <article class="admin-card full-width">
        <div class="card-header">
          <h2>Recent Orders</h2>
          <span class="tag">Latest</span>
        </div>
        <div id="adminOrders" class="admin-list"></div>
      </article>
    </section>
  </main>

  <script src="JS/app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('cc_user') || 'null');
    if (!user || user.role !== 'admin') {
      alert('Admin access only');
      window.location.href = 'dashboard.html';
    }

    function updateAdminStats() {
      const products = JSON.parse(localStorage.getItem('cc_products') || '[]');
      const orders = JSON.parse(localStorage.getItem('cc_orders') || '[]');
      const revenue = orders.reduce((sum, order) => sum + (order.total || 0), 0);
      document.getElementById('productCount').textContent = products.length;
      document.getElementById('orderCount').textContent = orders.length;
      document.getElementById('orderRevenue').textContent = `৳${revenue.toFixed(2)}`;
    }

    renderAdminProducts('adminProducts');
    renderOrders('adminOrders', true);
    updateAdminStats();

    document.getElementById('addProductBtn').addEventListener('click', () => {
      const name = document.getElementById('pName').value.trim();
      const price = parseFloat(document.getElementById('pPrice').value);
      if (!name || isNaN(price)) return alert('Enter valid name and price');
      addProduct({ name, price });
      renderAdminProducts('adminProducts');
      updateAdminStats();
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
    });
  </script>
</body>
</html>
