<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cup Corner — Dashboard</title>
  <link rel="stylesheet" href="CSS/login.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/logo.png" alt="Cup Corner logo"><div style="font-weight:700">Cup Corner</div></div>
    <nav>
      <a href="menu.html">Menu</a>
      <a href="orders.html">Orders</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <div>
        <h2>Welcome to Cup Corner</h2>
        <p class="muted">Simple demo Coffee Shop management UI — order, manage products, and view orders.</p>
        <div style="margin-top:12px">
          <a class="nav" href="menu.html">Start Ordering</a>
          <a class="nav" href="admin.html" id="adminLink" style="display:none">Admin Panel</a>
        </div>
      </div>
      <div id="user-area"></div>
    </div>

    <div style="margin-top:18px">
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </main>

  <script src="JS/app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('cc_user') || 'null');
    const userArea = document.getElementById('user-area');
    if (user) userArea.textContent = 'Signed in as: ' + user.username;
    else window.location.href = 'loginpage.html';

    if (user && user.role === 'admin') document.getElementById('adminLink').style.display = 'inline-block';

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('cc_user');
      window.location.href = 'loginpage.html';
    });
  </script>
</body>
</html>
