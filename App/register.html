<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — Cup Corner</title>
  <link rel="stylesheet" href="CSS/login.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/logo.png" alt="Cup Corner logo"><div style="font-weight:700">Cup Corner</div></div>
    <nav><a href="loginpage.html">Sign In</a></nav>
  </header>

  <main>
    <div class="auth-wrap">
      <h2>Create an account</h2>
      <form id="registerForm">
        <label>Username</label>
        <input id="r_username" type="text" >
        <span id="name-error" style="color: red;font-size:13px;"></span>
        <label>Email</label>
        <input id="r_email" type="email">
        <span id="email-error" style="color: red;font-size:13px;"></span>
        <label>Password</label>
        <input id="r_password" type="password" >
        <label>Confirm Password</label>
        <input id="r_password2" type="password">
        <span id="password-error" style="color: red;font-size:13px;"></span>
        <span id="both-error" style="color: red;font-size:13px;"></span>
        <div class="actions">
          <button type="submit" class="btn">Register</button>
          <a href="loginpage.html" class="btn" style="background:#eee;color:#111">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer>Already have an account? <a href="loginpage.html">Sign in</a></footer>

  <script src="JS/regvalidation.js"></script>
  <script src="JS/app.js"></script>
</body>
</html>
