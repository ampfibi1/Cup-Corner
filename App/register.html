<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — Cup Corner</title>
  <link rel="stylesheet" href="CSS/login.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/logo.png" alt="Cup Corner logo"><div style="font-weight:700">Cup Corner</div></div>
    <nav><a href="loginpage.html">Sign In</a></nav>
  </header>

  <main>
    <div class="auth-wrap">
      <h2>Create an account</h2>
      <form id="registerForm">
        <label>Username</label>
        <input id="r_username" type="text" required>
        <label>Email</label>
        <input id="r_email" type="email">
        <label>Password</label>
        <input id="r_password" type="password" required>
        <label>Confirm Password</label>
        <input id="r_password2" type="password" required>
        <div class="actions">
          <button type="submit" class="btn">Register</button>
          <a href="loginpage.html" class="btn" style="background:#eee;color:#111">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer>Already have an account? <a href="loginpage.html">Sign in</a></footer>

  <script src="JS/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e){
      e.preventDefault();
      const u = document.getElementById('r_username').value.trim();
      const p = document.getElementById('r_password').value;
      const p2 = document.getElementById('r_password2').value;
      if (!u || !p) return alert('Username and password required');
      if (p !== p2) return alert('Passwords do not match');
      const result = registerUser({ username: u, password: p, role: 'user' });
      if (!result.success) return alert(result.message);
      alert('Registration successful — please login');
      window.location.href = 'loginpage.html';
    });
  </script>
</body>
</html>
