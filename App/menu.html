<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Menu — Cup Corner</title>
  <link rel="stylesheet" href="CSS/login.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/logo.png" alt="Cup Corner logo"><div style="font-weight:700">Cup Corner</div></div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="orders.html">My Orders</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <div>
        <h2>Menu</h2>
        <p class="muted">Choose your favorite coffee and add to cart.</p>
      </div>
      <div></div>
    </div>

    <section id="products"></section>
    <section id="cart">
      <h2>Cart</h2>
      <div id="cartItems"></div>
      <div id="cartTotal"></div>
      <button id="placeOrderBtn" class="btn">Place Order</button>
    </section>
  </main>

  <script src="JS/app.js"></script>
  <script>
    initProducts();
    renderProducts('products');
    renderCart();

    document.getElementById('placeOrderBtn').addEventListener('click', () => {
      placeOrder();
    });
  </script>
</body>
</html>
